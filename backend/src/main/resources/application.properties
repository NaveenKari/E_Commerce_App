spring.application.name=Ecom

# Auto-loads backend/.env.properties (gitignored) if present, so local secrets
# like ANTHROPIC_API_KEY don't need to be exported in the shell every session.
# See .env.properties.example for the expected keys.
spring.config.import=optional:file:.env.properties

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/ecom
spring.datasource.username=postgres
spring.datasource.password=8121
spring.datasource.driver-class-name=org.postgresql.Driver


project.image=images/

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

